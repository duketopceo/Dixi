version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: ./packages/backend/Dockerfile
    ports:
      - "3001:3001"
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - WS_PORT=3002
      - VISION_SERVICE_URL=http://vision:5000
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=gemma3:4b
      - FRONTEND_URL=http://localhost:3000
    volumes:
      - ./models:/app/models
    depends_on:
      - vision
    networks:
      - dixi-network

  frontend:
    build:
      context: .
      dockerfile: ./packages/frontend/Dockerfile
      args:
        # Vite inlines env vars at build time — runtime environment has no effect
        - VITE_API_URL=http://localhost:3001/api
        - VITE_WS_URL=ws://localhost:3002
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - dixi-network

  vision:
    build:
      context: ./packages/vision
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PYTHON_ENV=production
      - VISION_SERVICE_PORT=5000
      - BACKEND_URL=http://backend:3001
    volumes:
      - ./models:/app/models
      - /dev/video0:/dev/video0
    devices:
      - /dev/video0:/dev/video0
    networks:
      - dixi-network

networks:
  dixi-network:
    driver: bridge
