version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: ./packages/backend/Dockerfile
    container_name: dixi-backend
    ports:
      - "3001:3001"
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - WS_PORT=3002
      - VISION_SERVICE_URL=http://vision:5000
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma3:4b}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      vision:
        condition: service_healthy
    networks:
      - dixi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: ./packages/frontend/Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:3001/api}
        - VITE_WS_URL=${VITE_WS_URL:-ws://localhost:3002}
        - VITE_VISION_SERVICE_URL=${VITE_VISION_SERVICE_URL:-http://localhost:5000}
    container_name: dixi-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - dixi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  vision:
    build:
      context: ./packages/vision
      dockerfile: Dockerfile
    container_name: dixi-vision
    ports:
      - "5000:5000"
    environment:
      - PYTHON_ENV=production
      - CAMERA_INDEX=${CAMERA_INDEX:-0}
      - FLASK_ENV=production
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    # For Mac: camera access via host network or device passthrough
    # Option 1: Use host network (simpler, but less isolated)
    # network_mode: host
    # Option 2: Device passthrough (if camera is accessible as /dev/video0)
    # devices:
    #   - /dev/video0:/dev/video0
    # Option 3: Use network camera (RTSP/HTTP stream)
    # Set CAMERA_INDEX to network stream URL
    networks:
      - dixi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/health', timeout=2)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  dixi-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  dixi-data:
    driver: local
  dixi-logs:
    driver: local
